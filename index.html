<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Scrappy Book · Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --bg:#0F1514;--surface:#18201F;--line:#2A3533;--fg:#E8F1EF;--muted:#9FB3AF;
    --mint:#63E3C8;--orange:#FF8452;--paper:#F6F3EA;
    --f-display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
    --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.5}
  header{max-width:1100px;margin:0 auto;padding:28px 16px 8px;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
  h1{margin:0;font-family:var(--f-display);font-weight:800;font-size:clamp(34px,8vw,48px);line-height:1.1;color:var(--orange)}
  /* the app's own wordmark: the pp is Doot in glasses, blushing at the oo, Doot with heart eyes */
  .brand-d{color:var(--orange)}
  .brand-face{display:inline-block;height:1.01em;vertical-align:-.28em;fill:var(--mint);color:var(--mint);overflow:visible}
  .brand-face.bf-pp{width:1.172em;margin:0 .01em}
  .brand-face.bf-oo{width:.98em;margin:0 .01em}
  .brand-face .blush{fill:var(--orange)}
  .badge{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
  .lede{flex-basis:100%;margin:4px 0 0;color:var(--muted);max-width:60ch}
  .find{max-width:1100px;margin:0 auto;padding:12px 16px}
  .find{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  /* the search, Smooth / LED and sort stay at the top as you scroll */
  .find{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid transparent}
  .find.stuck{border-bottom-color:var(--line);box-shadow:0 6px 16px rgba(0,0,0,.25)}
  .look{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
  .look button{font:inherit;font-weight:600;font-size:14px;border:0;background:transparent;color:var(--muted);border-radius:999px;padding:6px 14px;cursor:pointer}
  .look button[aria-pressed="true"]{background:var(--mint);color:#10201C}
  .find input{flex:1 1 220px;max-width:420px;font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
  .find input:focus{outline:2px solid var(--mint);outline-offset:1px}
  main{max-width:1100px;margin:0 auto;padding:8px 16px 48px;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
  /* drawings sit on paper, as in a scrapbook: their dark lines show, as they do on Doot's screen */
  .pic{aspect-ratio:1;border-radius:12px;background:var(--paper);display:grid;place-items:center;padding:8%}
  .pic img,.pic canvas{width:100%;height:100%;object-fit:contain}
  /* LED: on Doot's dark screen, lit dots, as Doot shows it */
  body.led .pic{background:#0D1720;padding:4%}
  body.led .pic img,body:not(.led) .pic canvas{display:none}
  .moves{align-self:flex-start;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--mint)}
  .card h2{margin:0;font-size:17px;font-weight:600;line-height:1.3}
  .card p{margin:0;color:var(--muted);font-size:14px}
  .by,.vby{font-size:13px;color:var(--mint);font-weight:500}.vby:empty{display:none}
  .by .link,.vby .link{font:inherit;color:var(--muted);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
  #shareBox .spic{aspect-ratio:1;width:min(60vw,220px);margin:0 auto 4px;border-radius:12px;background:var(--paper);padding:6%;display:grid;place-items:center}
  #shareBox .spic img{width:100%;height:100%;object-fit:contain}
  #shareBox textarea{width:100%;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-height:60px;resize:vertical}
  #shareBox .note{color:var(--muted);font-size:13px;margin:10px 0 0}
  .tags{display:flex;flex-wrap:wrap;gap:4px;margin:0;padding:0;list-style:none}
  .tags li{font-size:12px;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
  .add{margin-top:auto;display:block;text-align:center;text-decoration:none;font-weight:600;color:#10201C;background:var(--mint);border-radius:999px;padding:9px 14px}
  .add:active{opacity:.8}
  .empty{grid-column:1/-1;color:var(--muted)}
  .sort{font:inherit;font-size:14px;font-weight:600;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 12px}
  .pic{position:relative;cursor:zoom-in}
  .pic:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
  .heart svg{width:18px;height:18px}
  .row{margin-top:auto;display:flex;gap:8px;align-items:center}
  .row .add{flex:1;margin:0}
  .heart{display:flex;align-items:center;gap:6px;font:inherit;font-weight:600;font-size:14px;color:var(--muted);background:transparent;
    border:1px solid var(--line);border-radius:999px;padding:8px 12px;cursor:pointer}
  .heart[aria-pressed="true"]{color:var(--orange);border-color:var(--orange)}
  .heart[aria-pressed="true"] path{fill:currentColor}
  /* full screen: one drawing as big as fits, with its words and buttons below; swipe or the arrows for the next */
  #view{position:fixed;inset:0;z-index:10;background:#0D1720;display:flex;flex-direction:column;align-items:center;gap:12px;
    padding:max(14px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));touch-action:pan-y;overflow-y:auto}
  #view .vpic{touch-action:none}
  #view .vinfo{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%}
  #view[hidden]{display:none}
  #view .vtop{align-self:stretch;display:flex;justify-content:space-between;align-items:center}
  #view .vpos{color:var(--muted);font-size:13px}
  #view .x{width:40px;height:40px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--fg);font-size:22px;cursor:pointer}
  #view .vpic{flex:0 0 auto;aspect-ratio:1;width:min(100%,640px,max(240px,calc(100svh - 340px)));display:grid;place-items:center;border-radius:18px;background:var(--paper);padding:5%}
  #view .vpic img,#view .vpic canvas{width:100%;height:100%;object-fit:contain}
  body.led #view .vpic{background:#0D1720}
  body.led #view .vpic img,body:not(.led) #view .vpic canvas{display:none}
  #view h2{margin:0;font-size:20px;text-align:center}
  #view p{margin:0;color:var(--muted);text-align:center;max-width:52ch}
  #view .row{margin:0;width:100%;max-width:420px}
  #view .nav{display:flex;gap:10px}
  /* a phone on its side: the drawing as tall as the screen on the left, its words and buttons on the right */
  @media (orientation:landscape) and (max-height:600px){
    #view{display:grid;grid-template-columns:minmax(0,1fr) minmax(240px,38%);grid-template-rows:auto minmax(0,1fr);column-gap:20px;row-gap:8px;align-items:center;
      padding:max(10px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
    #view .vtop{grid-column:1/-1}
    #view .vpic{grid-column:1;grid-row:2;height:100%;max-width:none;aspect-ratio:1;width:auto;justify-self:center;padding:4%}
    #view .vinfo{grid-column:2;grid-row:2;align-self:center;overflow-y:auto;max-height:100%}
    #view h2{font-size:18px}#view p{font-size:14px}
  }
  #view .nav button{font:inherit;font-weight:600;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 16px;cursor:pointer}
  /* signing in, and your settings */
  .acct{margin-left:auto;align-self:center}
  .btn{font:inherit;font-weight:600;font-size:14px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer}
  .btn.primary{background:var(--mint);border-color:var(--mint);color:#10201C}
  .btn.small{font-size:13px;padding:5px 10px}
  .chip{display:flex;align-items:center;gap:6px;font:inherit;font-weight:600;font-size:14px;color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:999px;padding:8px 12px;cursor:pointer}
  .chip svg{width:18px;height:18px}
  #toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:30;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;display:flex;gap:12px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:calc(100vw - 32px)}
  #toast[hidden]{display:none}
  dialog{background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:18px;padding:20px;width:min(92vw,380px)}
  dialog::backdrop{background:rgba(0,0,0,.6)}
  dialog h2{margin:0 0 12px;font-size:20px}
  dialog label{display:block;font-weight:600;font-size:14px;margin:12px 0 6px}
  dialog input[type=text]{width:100%;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
  dialog .check{display:flex;gap:10px;align-items:flex-start;font-weight:500}
  dialog .check small{display:block;color:var(--muted);font-weight:400}
  dialog .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
  /* comments, under a drawing in full screen */
  #view .comments{width:100%;max-width:520px;text-align:left;border-top:1px solid var(--line);padding-top:12px;margin-top:4px}
  #view .comments h3{margin:0 0 8px;font-size:15px}
  #view .comments ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
  #view .comments li{display:flex;flex-direction:column;gap:2px}
  #view .comments li.hidden{opacity:.55}
  #view .comments .who{font-weight:600;font-size:14px}
  #view .comments .when{color:var(--muted);font-weight:400;font-size:12px;margin-left:6px}
  #view .comments .body{margin:0;color:var(--fg);text-align:left;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px}
  #view .comments .cacts{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:2px}
  #view .comments .cacts .chip{padding:3px 9px;font-size:13px}
  #view .comments .cacts .chip svg{width:14px;height:14px}
  #view .comments .link{font:inherit;font-size:13px;color:var(--muted);background:none;border:0;padding:3px 4px;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
  #view .comments .none{color:var(--muted);text-align:left;font-size:14px}
  #view .say{display:flex;flex-direction:column;gap:8px;margin-top:12px}
  #view .say textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:64px;resize:vertical}
  #view .say .srow{display:flex;justify-content:space-between;align-items:center;gap:8px}
  #view .say .count{color:var(--muted);font-size:12px}
  .chip[aria-pressed="true"]{color:var(--orange);border-color:var(--orange)}
  .chip[aria-pressed="true"] path{fill:currentColor}
  footer{max-width:1100px;margin:0 auto;padding:0 16px 32px;color:var(--muted);font-size:13px}
</style>
</head>
<body>
  <header>
    <h1 role="img" aria-label="Scrappy Book"><span class="brand-d">Scra</span><svg class="brand-face bf-pp" viewBox="212 93 232 200" aria-hidden="true"><rect x="226" y="133" width="24" height="123" rx="12"/><path fill-rule="evenodd" d="M268 133H268A42 42 0 0 1 310 175V195A42 42 0 0 1 268 237A42 42 0 0 1 226 195V175A42 42 0 0 1 268 133ZM281 149H290A3 3 0 0 1 293 152V161A3 3 0 0 1 290 164H281A3 3 0 0 1 278 161V152A3 3 0 0 1 281 149Z"/><rect x="346" y="133" width="24" height="123" rx="12"/><path fill-rule="evenodd" d="M388 133H388A42 42 0 0 1 430 175V195A42 42 0 0 1 388 237A42 42 0 0 1 346 195V175A42 42 0 0 1 388 133ZM401 149H410A3 3 0 0 1 413 152V161A3 3 0 0 1 410 164H401A3 3 0 0 1 398 161V152A3 3 0 0 1 401 149Z"/><ellipse class="blush" cx="272" cy="270" rx="17" ry="9" opacity=".9"/><ellipse class="blush" cx="400" cy="270" rx="17" ry="9" opacity=".9"/><path d="M306 266 Q326 282 346 266" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round"/></svg><span class="brand-d">y B</span><svg class="brand-face bf-oo" viewBox="194 93 194 200" aria-hidden="true"><path d="M234 240.5L186.5 190.5A24 24 0 0 1 234 162A24 24 0 0 1 281.5 190.5Z"/><path d="M334 240.5L286.5 190.5A24 24 0 0 1 334 162A24 24 0 0 1 381.5 190.5Z"/><path d="M256.4 260Q286.4 260 316.4 260Q312.4 290 286.4 290Q260.4 290 256.4 260Z"/></svg><span class="brand-d">k</span></h1><span class="badge">Preview</span><div class="acct" id="acct"></div>
    <p class="lede">Drawings from Doot’s Scrappy Book. Tap <b>Add to my Doot</b> on your phone to put one in yours.</p>
  </header>
  <div class="find"><input id="find" type="search" placeholder="Find a drawing" aria-label="Find a drawing">
    <div class="look" role="group" aria-label="Show drawings as"><button type="button" data-look="smooth">Smooth</button><button type="button" data-look="led">LED</button></div>
    <select class="sort" id="sort" aria-label="Sort by"><option value="new">Newest</option><option value="hearts">Most hearted</option></select></div>
  <main id="list"></main>
  <footer>A test page, not public yet.</footer>
  <div id="toast" role="status" hidden><span></span></div>
  <dialog id="shareBox">
    <h2>Share a drawing</h2>
    <div class="spic"><img alt=""></div>
    <label for="shareTitle">Title</label><input id="shareTitle" type="text" maxlength="60">
    <label for="shareBlurb">About it</label><textarea id="shareBlurb" maxlength="300"></textarea>
    <p class="note">It’ll be on the Scrappy Book site for everyone to see and add to their Doot, with your name.</p>
    <div class="acts"><button class="btn" type="button" id="shareCancel">Cancel</button><button class="btn primary" type="button" id="shareGo">Share it</button></div>
  </dialog>
  <dialog id="me">
    <h2>Your settings</h2>
    <label for="myName">Your name</label>
    <input id="myName" type="text" maxlength="40" autocomplete="nickname">
    <label class="check"><input id="myCensor" type="checkbox"><span>Censored mode<small>Bad words in comments are hidden with stars.</small></span></label>
    <div class="acts"><button class="btn" type="button" id="signOut">Sign out</button><button class="btn" type="button" id="meClose">Cancel</button><button class="btn primary" type="button" id="meSave">Save</button></div>
  </dialog>
  <div id="view" role="dialog" aria-modal="true" aria-label="Drawing" hidden>
    <div class="vtop"><span class="vpos"></span><button class="x" type="button" aria-label="Close">×</button></div>
    <div class="vpic"><img alt=""><canvas></canvas></div>
    <div class="vinfo">
      <h2></h2><span class="vby"></span><p></p>
      <div class="look" role="group" aria-label="Show it as"><button type="button" data-look="smooth">Smooth</button><button type="button" data-look="led">LED</button></div>
      <div class="row"><button class="heart" type="button"></button><a class="add">Add to my Doot</a></div>
      <div class="nav"><button type="button" data-step="-1">‹ Previous</button><button type="button" data-step="1">Next ›</button></div>
      <section class="comments" aria-label="Comments"><h3></h3><ol></ol><div class="say"></div></section>
    </div>
  </div>
<script>
// Each drawing is shown as an image (so nothing in it can run; animations still play), and "Add to my Doot" opens
// the app with the address of the drawing's own file, which the app fetches and adds to its Scrappy Book.
const list=document.getElementById('list'),find=document.getElementById('find'),sort=document.getElementById('sort'),view=document.getElementById('view');
let all=[],shown=[];
// as an image: a browser needs an SVG to say what it is (xmlns), which many of Doot's drawings leave out
const withNS=svg=>/^\s*<svg\b[^>]*\sxmlns\s*=/i.test(svg)?svg:String(svg).replace(/^\s*<svg\b/i,'<svg xmlns="http://www.w3.org/2000/svg"');
const svgURL=svg=>'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(withNS(svg));
const ICON_HEART='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>';
// The server (Supabase): hearts, comments and who's signed in. Anyone can look; hearting and commenting need
// signing in with Google. Its rules (in supabase/schema.sql) let people change only their own things.
const SB_URL='https://jkiackmuihwqzvrgzhfu.supabase.co',SB_KEY='sb_publishable_s3aZO-xGMBqOS9GbhqPlzQ_1NbLHJPI';
const sb=supabase.createClient(SB_URL,SB_KEY);
let user=null,profile=null,admin=false;
const heartCount={},commentCount={};let mine=new Set();
const hearts=d=>heartCount[d.id]||0;
const ICON_TALK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg>';
const toastEl=document.getElementById('toast');let toastTimer=0;
function toast(msg,action){
  toastEl.replaceChildren(Object.assign(document.createElement('span'),{textContent:msg}));
  if(action){const b=Object.assign(document.createElement('button'),{className:'btn small primary',type:'button',textContent:action.label});b.addEventListener('click',()=>{toastEl.hidden=true;action.go();});toastEl.append(b);}
  toastEl.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{toastEl.hidden=true;},action?7000:3500);
}
const signIn=()=>sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname}});
const needSignIn=what=>toast('Sign in with Google to '+what+'.',{label:'Sign in',go:signIn});
async function loadCounts(){
  const [h,c]=await Promise.all([sb.from('drawing_heart_counts').select('*'),sb.from('comment_counts').select('*')]);
  (h.data||[]).forEach(r=>{heartCount[r.drawing_id]=r.hearts;});(c.data||[]).forEach(r=>{commentCount[r.drawing_id]=r.comments;});
  mine=new Set();
  if(user){const m=await sb.from('drawing_hearts').select('drawing_id').eq('user_id',user.id);(m.data||[]).forEach(r=>mine.add(r.drawing_id));}
}
function heartButton(b,d){
  b.innerHTML=ICON_HEART+'<span></span>';b.querySelector('span').textContent=hearts(d);
  b.setAttribute('aria-pressed',String(mine.has(d.id)));b.setAttribute('aria-label',(mine.has(d.id)?'Take your heart off ':'Heart ')+d.title+', '+hearts(d)+' hearts');
}
// shown at once, then saved; put back if saving fails
async function toggleHeart(d){
  if(!user)return needSignIn('heart drawings');
  const on=!mine.has(d.id);
  const paint=()=>document.querySelectorAll('[data-heart="'+d.id+'"]').forEach(b=>heartButton(b,d));
  on?mine.add(d.id):mine.delete(d.id);heartCount[d.id]=hearts(d)+(on?1:-1);paint();
  const r=on?await sb.from('drawing_hearts').insert({drawing_id:d.id}):await sb.from('drawing_hearts').delete().eq('drawing_id',d.id).eq('user_id',user.id);
  if(r.error){on?mine.delete(d.id):mine.add(d.id);heartCount[d.id]=hearts(d)+(on?-1:1);paint();toast('That heart didn’t save. Try again.');}
}
// Doot is an Android app: anywhere else, "Add" says how instead of opening a link the browser can't follow
const ANDROID=/Android/i.test(navigator.userAgent);
function addButton(a,d){
  a.href=addLink(d);
  if(!ANDROID)a.addEventListener('click',e=>{e.preventDefault();toast('Doot is an Android app: open this page on your Android phone with Doot on it, and tap Add there.');});
}
const addLink=d=>{
  const src=d.sid?SB_URL+'/rest/v1/rpc/shared_drawing?n='+d.sid+'&apikey='+SB_KEY:new URL('d/'+d.id+'.json',location.href).href;
  return 'intent://add?src='+encodeURIComponent(src)+'#Intent;scheme=doot;package=com.romansedition.doot;end';
};
function show(){
  const q=find.value.trim().toLowerCase();
  shown=all.filter(d=>!q||[d.title,d.blurb,...(d.tags||[])].join(' ').toLowerCase().includes(q));
  if(sort.value==='hearts')shown=shown.map((d,i)=>[d,i]).sort((x,y)=>hearts(y[0])-hearts(x[0])||x[1]-y[1]).map(x=>x[0]);
  list.replaceChildren(...shown.map(d=>{
    const a=document.createElement('article');a.className='card';
    a.innerHTML='<div class="pic"><img alt=""><canvas></canvas></div><h2></h2><p></p><ul class="tags"></ul><div class="row"><button class="heart" type="button"></button><button class="chip talk" type="button"></button><a class="add">Add</a></div>';
    const tb=a.querySelector('.talk');tb.innerHTML=ICON_TALK+'<span></span>';tb.querySelector('span').textContent=commentCount[d.id]||0;
    tb.setAttribute('aria-label',(commentCount[d.id]||0)+' comments on '+d.title);tb.addEventListener('click',()=>openView(d,true));
    a.querySelector('.add').setAttribute('aria-label','Add '+d.title+' to my Doot');
    const img=a.querySelector('img');img.src=svgURL(d.svg);img.alt=d.title;
    const pic=a.querySelector('.pic');pic.tabIndex=0;pic.setAttribute('role','button');pic.setAttribute('aria-label','Show '+d.title+' full screen');
    pic.addEventListener('click',()=>openView(d));
    pic.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openView(d);}});
    const hb=a.querySelector('.heart');hb.dataset.heart=d.id;heartButton(hb,d);hb.addEventListener('click',()=>{toggleHeart(d);if(sort.value==='hearts')show();});
    if(d.moves){const m=document.createElement('span');m.className='moves';m.textContent='Animation';a.querySelector('.pic').after(m);}
    a.querySelector('h2').textContent=d.title;a.querySelector('p').textContent=d.blurb||'';
    if(d.by){const by=document.createElement('span');by.className='by';by.textContent='Shared by '+d.by;const x=deleteLink(d);if(x)by.append(' · ',x);a.querySelector('h2').after(by);}
    a.querySelector('.tags').replaceChildren(...(d.tags||[]).map(t=>{const li=document.createElement('li');li.textContent=t;return li;}));
    addButton(a.querySelector('.add'),d);
    leds.set(a.querySelector('canvas'),{img,svg:d.svg,moves:d.moves,drawn:false});
    return a;
  }));
  if(!shown.length)list.innerHTML='<p class="empty">No drawings match that.</p>';
}
find.addEventListener('input',show);
sort.addEventListener('change',show);
// a line under the bar once the page has scrolled beneath it
const bar=document.querySelector('.find');
new IntersectionObserver(([e])=>bar.classList.toggle('stuck',!e.isIntersecting)).observe(document.querySelector('header'));

// full screen
let viewing=null;
function openView(d,toComments){
  viewing=d;view.hidden=!d;document.body.style.overflow=d?'hidden':'';if(!d)return;
  view.scrollTop=0;loadComments(d).then(()=>{if(toComments)view.querySelector('.comments').scrollIntoView({block:'start'});});
  const img=view.querySelector('img');img.src=svgURL(d.svg);img.alt=d.title;
  view.querySelector('h2').textContent=d.title;view.querySelector('p').textContent=d.blurb||'';
  const vby=view.querySelector('.vby');vby.replaceChildren();
  if(d.by){vby.append('Shared by '+d.by);const x=deleteLink(d);if(x)vby.append(' · ',x);}
  const hb=view.querySelector('.heart');hb.dataset.heart=d.id;heartButton(hb,d);
  const va=view.querySelector('.add'),fresh=va.cloneNode(true);va.replaceWith(fresh);addButton(fresh,d); // no handlers from the last drawing
  const i=shown.indexOf(d);view.querySelector('.vpos').textContent=shown.length>1?(i+1)+' of '+shown.length:'';
  leds.set(view.querySelector('canvas'),{img,svg:d.svg,moves:d.moves,drawn:false,cols:100});
  view.querySelector('.x').focus();
}
const step=by=>{const i=shown.indexOf(viewing),n=shown[i+by];if(n)openView(n);};
view.querySelector('.x').addEventListener('click',()=>openView(null));
view.querySelector('.heart').addEventListener('click',()=>{if(viewing){toggleHeart(viewing);}});
view.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>step(+b.dataset.step)));
addEventListener('keydown',e=>{if(view.hidden||/^(INPUT|TEXTAREA)$/.test(e.target.tagName)||document.querySelector('dialog[open]'))return;if(e.key==='Escape')openView(null);else if(e.key==='ArrowRight')step(1);else if(e.key==='ArrowLeft')step(-1);});
let sw=null;
view.addEventListener('pointerdown',e=>{sw=/^(INPUT|TEXTAREA|BUTTON|A)$/.test(e.target.tagName)?null:{x:e.clientX,y:e.clientY,onPic:!!e.target.closest('.vpic')};});
// swipe left or up for the next, right or down for the one before
view.addEventListener('pointerup',e=>{
  if(!sw)return;const s0=sw,dx=e.clientX-sw.x,dy=e.clientY-sw.y;sw=null;
  if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5)step(dx<0?1:-1);
  else if(s0.onPic&&Math.abs(dy)>50&&Math.abs(dy)>Math.abs(dx)*1.5)step(dy<0?1:-1); // up and down on the drawing (elsewhere, it scrolls)
});
view.addEventListener('pointercancel',()=>{sw=null;});

// Comments: oldest first, each with its writer's name, a heart (with how many), and Report (or Delete, for your
// own); hidden ones (by Roman, or 3 reports) only Roman sees, marked. Bad words are starred out in censored mode,
// which is on unless you've turned it off in your settings.
const BAD=['fuck','shit','bitch','cunt','dick','cock','pussy','asshole','arsehole','bastard','slut','whore','fag','faggot','nigger','nigga','retard','wanker','twat','prick','motherfucker','bullshit','dickhead','bollocks','piss'];
const BAD_RE=new RegExp('\\b('+BAD.join('|')+')(s|es|ed|er|ers|ing|ings|y|ty|tier|tiest|head|heads|hole|holes|face|faces)?\\b','gi'); // and the usual endings (shitty, dickhead)
const censoring=()=>!profile||profile.censor;
const clean=t=>censoring()?t.replace(BAD_RE,w=>w[0]+'*'.repeat(w.length-1)):t;
function ago(t){
  const s=(Date.now()-new Date(t))/1000;
  if(s<60)return 'just now';if(s<3600)return Math.floor(s/60)+'m';if(s<86400)return Math.floor(s/3600)+'h';
  if(s<604800)return Math.floor(s/86400)+'d';return new Date(t).toLocaleDateString(undefined,{day:'numeric',month:'short'});
}
const cbox=view.querySelector('.comments');
async function loadComments(d){
  const ol=cbox.querySelector('ol');ol.replaceChildren();cbox.querySelector('h3').textContent='Comments';say(d);
  const r=await sb.from('comments_shown').select('*').eq('drawing_id',d.id).order('created_at',{ascending:true});
  if(viewing!==d)return;
  const list=r.data||[];let liked=new Set();
  if(user&&list.length){const h=await sb.from('comment_hearts').select('comment_id').eq('user_id',user.id).in('comment_id',list.map(c=>c.id));(h.data||[]).forEach(x=>liked.add(x.comment_id));}
  const shownCount=list.filter(c=>!c.hidden).length;commentCount[d.id]=shownCount;
  cbox.querySelector('h3').textContent=shownCount?'Comments ('+shownCount+')':'Comments';
  if(r.error){ol.innerHTML='<li class="none">The comments didn’t load. Try again in a moment.</li>';return;}
  if(!list.length){ol.innerHTML='<li class="none">No comments yet. Say something nice!</li>';return;}
  list.forEach(c=>ol.append(comment(c,liked.has(c.id))));
}
function comment(c,liked){
  const li=document.createElement('li');if(c.hidden)li.className='hidden';
  li.innerHTML='<div><span class="who"></span><span class="when"></span></div><p class="body"></p><div class="cacts"></div>';
  li.querySelector('.who').textContent=c.display_name;
  li.querySelector('.when').textContent=ago(c.created_at)+(c.hidden?' · hidden':'');
  li.querySelector('.body').textContent=clean(c.body);
  const acts=li.querySelector('.cacts');
  const hb=document.createElement('button');hb.type='button';hb.className='chip';
  let on=liked,n=c.hearts;
  const paint=()=>{hb.innerHTML=ICON_HEART+'<span></span>';hb.querySelector('span').textContent=n;hb.setAttribute('aria-pressed',String(on));hb.setAttribute('aria-label',(on?'Take your heart off this comment':'Heart this comment')+', '+n+' hearts');};
  paint();
  hb.addEventListener('click',async()=>{
    if(!user)return needSignIn('heart comments');
    on=!on;n+=on?1:-1;paint();
    const r=on?await sb.from('comment_hearts').insert({comment_id:c.id}):await sb.from('comment_hearts').delete().eq('comment_id',c.id).eq('user_id',user.id);
    if(r.error){on=!on;n+=on?1:-1;paint();toast('That heart didn’t save. Try again.');}
  });
  acts.append(hb);
  const link=(text,go)=>{const b=document.createElement('button');b.type='button';b.className='link';b.textContent=text;b.addEventListener('click',go);acts.append(b);};
  const mineC=user&&c.user_id===user.id;
  if(mineC||admin)link('Delete',async()=>{
    if(!confirm('Delete this comment?'))return;
    const r=await sb.from('comments').delete().eq('id',c.id);
    if(r.error)return toast('It didn’t delete. Try again.');
    loadComments(viewing);
  });
  if(admin)link(c.hidden?'Show again':'Hide',async()=>{
    const r=await sb.from('comments').update({hidden:!c.hidden}).eq('id',c.id);
    if(r.error)return toast('That didn’t save. Try again.');
    loadComments(viewing);
  });
  if(!mineC&&!c.hidden)link('Report',async()=>{
    if(!user)return needSignIn('report comments');
    if(!confirm('Report this comment? It’s hidden once a few people report it, and checked.'))return;
    const r=await sb.from('reports').insert({comment_id:c.id});
    toast(r.error&&r.error.code!=='23505'?'The report didn’t send. Try again.':'Thanks. It’s been reported.');
  });
  return li;
}
// the box to write one, or a button to sign in first
function say(d){
  const box=cbox.querySelector('.say');box.replaceChildren();
  if(!user){const b=Object.assign(document.createElement('button'),{className:'btn',type:'button',textContent:'Sign in with Google to comment'});b.addEventListener('click',signIn);box.append(b);return;}
  box.innerHTML='<textarea maxlength="500" placeholder="Add a comment" aria-label="Add a comment"></textarea><div class="srow"><span class="count">0 / 500</span><button class="btn primary" type="button">Post</button></div>';
  const ta=box.querySelector('textarea'),post=box.querySelector('button'),count=box.querySelector('.count');
  ta.addEventListener('input',()=>{count.textContent=ta.value.length+' / 500';});
  post.addEventListener('click',async()=>{
    const body=ta.value.trim();if(!body)return;
    post.disabled=true;const r=await sb.from('comments').insert({drawing_id:d.id,body});post.disabled=false;
    if(r.error)return toast(/Slow down/.test(r.error.message)?'Slow down a little: too many comments at once.':'Your comment didn’t post. Try again.');
    ta.value='';count.textContent='0 / 500';await loadComments(d);
    const ol=cbox.querySelector('ol');ol.lastElementChild&&ol.lastElementChild.scrollIntoView({block:'nearest'});
    updateCard(d);
  });
}
function updateCard(d){document.querySelectorAll('.card').forEach(a=>{if(a.querySelector('[data-heart="'+d.id+'"]')){const t=a.querySelector('.talk span');if(t)t.textContent=commentCount[d.id]||0;}});}

// Signing in: a button at the top, or your name, which opens your settings (name, censored mode, sign out)
const acct=document.getElementById('acct'),me=document.getElementById('me');
function showAcct(){
  acct.replaceChildren();
  const b=document.createElement('button');b.type='button';b.className=user?'btn':'btn primary';
  b.textContent=user?(profile?profile.display_name:'You'):'Sign in';
  b.addEventListener('click',()=>{if(!user)return signIn();document.getElementById('myName').value=profile?profile.display_name:'';document.getElementById('myCensor').checked=censoring();me.showModal();});
  acct.append(b);
}
document.getElementById('meClose').addEventListener('click',()=>me.close());
document.getElementById('signOut').addEventListener('click',async()=>{me.close();await sb.auth.signOut();});
document.getElementById('meSave').addEventListener('click',async()=>{
  const name=document.getElementById('myName').value.replace(/\s+/g,' ').trim().slice(0,40),censor=document.getElementById('myCensor').checked;
  if(!name)return toast('Your name can’t be empty.');
  const r=await sb.from('profiles').update({display_name:name,censor}).eq('id',user.id).select().single();
  if(r.error)return toast('That didn’t save. Try again.');
  profile=r.data;me.close();showAcct();if(viewing)loadComments(viewing);toast('Saved.');
});
// a shared drawing's Delete: for whoever shared it, and for Roman (admin) on any
function deleteLink(d){
  if(!d.sid||!user||!(d.uid===user.id||admin))return null;
  const x=Object.assign(document.createElement('button'),{type:'button',className:'link',textContent:'Delete'});
  x.setAttribute('aria-label','Delete '+d.title);
  x.addEventListener('click',async e=>{
    e.stopPropagation();if(!confirm('Delete “'+d.title+'” from the Scrappy Book site?'))return;
    const r=await sb.from('shared_drawings').delete().eq('id',d.sid).select('id');
    if(r.error||!r.data||!r.data.length)return toast('It didn’t delete. Try signing out and in again.');
    if(viewing===d)openView(null);await loadShared();show();toast('Deleted.');
  });
  return x;
}
// drawings people shared from their Doot (each "s<id>", for hearts and comments), newest first
let curated=[],shared=[];
async function loadShared(){
  const r=await sb.from('shared_drawings_shown').select('*').order('created_at',{ascending:false}).limit(200);
  shared=(r.data||[]).map(x=>({id:'s'+x.id,sid:x.id,uid:x.user_id,by:x.display_name,title:x.title,blurb:x.blurb,svg:x.svg,tags:x.tags||[],when:x.when_fits,moves:/<(animate|animateTransform|animateMotion|set)\b/i.test(x.svg)}));
  all=shared.concat(curated);
}
// Share, from the app: it opens this page with the drawing in the link's # (kept here while you sign in, if you need to)
const shareBox=document.getElementById('shareBox');let pending=null;
function readShare(){
  if(location.hash.startsWith('#share=')){
    try{const b=atob(location.hash.slice(7).replace(/-/g,'+').replace(/_/g,'/'));pending=JSON.parse(new TextDecoder().decode(Uint8Array.from(b,c=>c.charCodeAt(0))));sessionStorage.setItem('sb.share',JSON.stringify(pending));}
    catch(e){toast('That drawing didn’t come through. Try sharing it again from Doot.');}
    history.replaceState(null,'',location.pathname);
  }else{try{pending=JSON.parse(sessionStorage.getItem('sb.share')||'null')}catch(e){}}
  if(pending&&!/^\s*<svg[\s>]/i.test(pending.svg||''))pending=null;
}
function offerShare(){
  if(!pending||shareBox.open)return;
  shareBox.querySelector('img').src=svgURL(pending.svg);
  document.getElementById('shareTitle').value=(pending.title||'').slice(0,60);document.getElementById('shareBlurb').value=(pending.blurb||'').slice(0,300);
  const go=document.getElementById('shareGo');go.textContent=user?'Share it':'Sign in with Google to share';
  shareBox.showModal();
}
document.getElementById('shareCancel').addEventListener('click',()=>{pending=null;sessionStorage.removeItem('sb.share');shareBox.close();});
document.getElementById('shareGo').addEventListener('click',async()=>{
  if(!user)return signIn(); // back here afterwards, still holding the drawing
  const title=document.getElementById('shareTitle').value.replace(/\s+/g,' ').trim();if(!title)return toast('Give it a title first.');
  const go=document.getElementById('shareGo');go.disabled=true;
  const r=await sb.from('shared_drawings').insert({title,blurb:document.getElementById('shareBlurb').value.trim(),svg:pending.svg.trim(),
    tags:(pending.tags||[]).map(String).slice(0,8),when_fits:String(pending.when||'').slice(0,120)}).select('id').single();
  go.disabled=false;
  if(r.error)return toast(/plenty for today/.test(r.error.message)?'That’s plenty for today: up to 20 shared drawings a day.':'It didn’t share. It may be too big, or have something in it that isn’t allowed.');
  pending=null;sessionStorage.removeItem('sb.share');shareBox.close();
  await loadShared();show();toast('Shared! It’s in the Scrappy Book now.');
  const d=all.find(x=>x.sid===r.data.id);if(d)openView(d);
});
readShare();
async function signedIn(session){
  user=session?session.user:null;profile=null;admin=false;
  if(user){
    const [p,a]=await Promise.all([sb.from('profiles').select('*').eq('id',user.id).maybeSingle(),sb.rpc('is_admin')]);
    profile=p.data;admin=!!a.data;
  }
  showAcct();await loadCounts();if(all.length)show();if(viewing)openView(viewing);
  offerShare();
}
sb.auth.onAuthStateChange((ev,session)=>{if(ev==='INITIAL_SESSION'||ev==='SIGNED_IN'||ev==='SIGNED_OUT')setTimeout(()=>signedIn(session));});

// LED: each drawing drawn as Doot's screen shows it: on a grid of round lights, its dark lines lit in Doot's mint
// (they'd vanish on the dark screen otherwise), each light at one of three brightnesses. An animation is played from
// frames made once (a hidden image stops moving), each the drawing at one moment of its loop, only while on screen.
const COLS=64,MINT=[99,227,200],leds=new Map();
let look='smooth';try{look=localStorage.getItem('sb.look')||'smooth'}catch(e){}
if(location.hash==='#led'||location.hash==='#smooth')look=location.hash.slice(1); // a link can say which
const smalls={};
function paint(c,img,COLS=64){
  const small=smalls[COLS]||(smalls[COLS]=Object.assign(document.createElement('canvas'),{width:COLS,height:COLS})),sx=small.getContext('2d',{willReadFrequently:true});
  const dp=Math.min(devicePixelRatio||1,2),w=Math.round(c.clientWidth*dp)||300;
  if(c.width!==w){c.width=c.height=w;}
  sx.clearRect(0,0,COLS,COLS);sx.drawImage(img,0,0,COLS,COLS);
  const px=sx.getImageData(0,0,COLS,COLS).data,g=c.getContext('2d'),cell=w/COLS,r=cell*.4;
  g.clearRect(0,0,w,w);
  g.fillStyle='rgba(140,190,200,.08)';
  for(let j=0;j<COLS;j++)for(let i=0;i<COLS;i++){g.beginPath();g.arc((i+.5)*cell,(j+.5)*cell,r*.9,0,7);g.fill();}
  g.shadowBlur=6*dp;g.shadowColor='rgba(99,227,200,.6)';
  for(let j=0;j<COLS;j++)for(let i=0;i<COLS;i++){
    const k=(j*COLS+i)*4,a=px[k+3]/255;if(a<.22)continue;
    let [R,G,B]=[px[k],px[k+1],px[k+2]];
    if((.299*R+.587*G+.114*B)/255<.35)[R,G,B]=MINT;
    g.fillStyle=`rgba(${R},${G},${B},${a>.7?1:a>.45?.72:.42})`;
    g.beginPath();g.arc((i+.5)*cell,(j+.5)*cell,r,0,7);g.fill();
  }
  g.shadowBlur=0;
}
// an animation's frames: the SVG with every animation begun [t] seconds earlier shows its moment [t]
const ANIM=/<(animate|animateTransform|animateMotion|set)\b/gi;
function loopOf(svg){let most=0;for(const m of svg.matchAll(/\sdur\s*=\s*["']([\d.]+)(ms|s)?["']/gi)){const v=+m[1]*(m[2]==='ms'?.001:1);if(v>most)most=v;}return Math.min(6,Math.max(.5,most||2));}
function at(svg,t){
  return svg.replace(/<(animate|animateTransform|animateMotion|set)\b([^>]*?)(\/?)>/gi,(all,tag,attrs,close)=>{
    const b=attrs.match(/\sbegin\s*=\s*(["'])([^"']*)\1/i);
    if(!b)return `<${tag}${attrs} begin="${-t}s"${close}>`;
    const v=b[2].trim().match(/^(-?[\d.]+)(ms|s)?$/);if(!v)return all;
    return `<${tag}${attrs.replace(b[0],` begin="${+v[1]*(v[2]==='ms'?.001:1)-t}s"`)}${close}>`;
  });
}
function framesOf(s){
  if(s.frames)return;const loop=loopOf(s.svg),n=Math.min(24,Math.max(8,Math.round(loop*10)));
  s.fps=n/loop;s.frames=Array.from({length:n},(_,i)=>{const im=new Image();im.src=svgURL(at(s.svg,i*loop/n));return im;});
}
let last=0;
function tick(t){
  requestAnimationFrame(tick);
  if(look!=='led'||t-last<90)return;last=t; // about 11 frames a second is plenty for the lights
  for(const [c,s] of leds){
    if(!c.isConnected){leds.delete(c);continue;}
    if(s.drawn&&!s.moves)continue;
    const b=c.getBoundingClientRect();if(b.bottom<0||b.top>innerHeight)continue;
    let img=s.img;
    if(s.moves){framesOf(s);img=s.frames[Math.floor(t/1000*s.fps)%s.frames.length];}
    if(!img.complete||!img.naturalWidth)continue;
    paint(c,img,s.cols);s.drawn=true;
  }
}
requestAnimationFrame(tick);
function setLook(v){
  look=v;document.body.classList.toggle('led',v==='led');
  document.querySelectorAll('.look button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.look===v)));
  leds.forEach(s=>{s.drawn=false;});
  try{localStorage.setItem('sb.look',v)}catch(e){}
}
document.querySelectorAll('.look button').forEach(b=>b.addEventListener('click',()=>setLook(b.dataset.look)));
setLook(look==='led'?'led':'smooth');
fetch('drawings.json').then(r=>r.json()).then(async d=>{curated=d;all=d;show();await loadShared();await loadCounts();show();}).catch(()=>{list.innerHTML='<p class="empty">The drawings didn’t load. Try refreshing.</p>';});
</script>
